<!doctype html><html lang="zh"><meta charset="utf-8"><title>图文剪贴板隔离验收</title><style>body{font:16px system-ui;margin:24px;background:#f6f3ec}#paste{min-height:300px;border:1px solid #999;padding:20px;background:white}img{max-width:600px}output{display:block;margin:12px 0}</style><h1>图文剪贴板隔离验收</h1><p>仅在本页粘贴，内容不上传、不保存。</p><output id="count">等待粘贴</output><div id="paste" contenteditable="true" role="textbox" aria-label="图文粘贴验收区"></div><script>document.getElementById('paste').addEventListener('input',e=>{const n=e.currentTarget;document.getElementById('count').textContent=`文本 ${n.textContent.length} 字符 · 图片 ${n.querySelectorAll('img').length} 张 · 带样式节点 ${n.querySelectorAll('[style]').length} 个`;});</script></html>
