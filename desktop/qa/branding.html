<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSSD · 正交图标验收</title>
<link rel="stylesheet" href="/src/styles.css">
<style>
  html,body{height:auto;overflow:auto}body{padding:32px;background:#e9e8e4;color:#20242c;font-family:-apple-system,sans-serif}main{max-width:1200px;margin:auto}h1{font-size:25px;margin:0 0 8px}p{color:#646873;margin:0 0 24px}.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}.icon{background:#fff;border-radius:18px;padding:18px}.icon>img{display:block;width:100%;max-width:180px;margin:auto}.icon h2{font-size:15px;margin:12px 0}.sizes{display:flex;align-items:center;gap:12px}.sizes img{display:block}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}.surface{padding:22px;border-radius:14px;background:var(--panel);color:var(--ink)}.brand-line{display:flex;align-items:center;gap:12px;font-weight:600}.surface small{display:block;margin-top:16px;color:var(--muted)}.tray{width:22px;height:22px;background:currentColor;-webkit-mask:url('/src-tauri/icons/tray-macos.png') center / contain no-repeat;mask:url('/src-tauri/icons/tray-macos.png') center / contain no-repeat}.contexts{display:flex;align-items:center;gap:20px;margin-top:20px}.contexts img{display:block;width:64px;height:64px}.contexts .rounded{border-radius:32%}.native{display:grid;grid-template-columns:1fr 1fr;gap:18px}.native section{padding:24px;border-radius:14px;background:#fafafa}.native .dark{background:#11151d;color:#f3f5f7}.dock{display:flex;gap:16px;align-items:center}.dock img{display:block}.micro{display:flex;align-items:center;gap:12px;margin-top:14px}.micro span{display:block;width:16px;height:16px;background:currentColor;-webkit-mask:url('/rssd-mark.svg') center / contain no-repeat;mask:url('/rssd-mark.svg') center / contain no-repeat}@media(max-width:700px){.icons,.themes{grid-template-columns:repeat(2,1fr)}}
</style>
<main>
  <h1>RSSD · 无边框正交字形</h1>
  <p>去掉外框，放大字形并加宽字距。下方使用应用的实际主题样式。</p>
  <div class="icons" id="icons"></div>
  <div class="themes" id="themes"></div>
  <div class="native">
    <section><b>浅色桌面</b><div class="dock" data-dock></div><div class="micro"><span></span>16 px 单色标识</div></section>
    <section class="dark"><b>深色桌面</b><div class="dock" data-dock></div><div class="micro"><span></span>16 px 单色标识</div></section>
  </div>
</main>
<script type="module">
  const variants={dark:'石墨',light:'暖白',blue:'深蓝',amber:'琥珀'};
  document.querySelector('#icons').innerHTML=Object.entries(variants).map(([id,title])=>`<article class="icon"><img src="/branding/rssd-icon-${id}.png" alt="${title}"><h2>${title}</h2><div class="sizes">${[64,32,24,16].map(size=>`<img src="/branding/rssd-icon-${id}.png" width="${size}" height="${size}" alt="${size}px">`).join('')}</div></article>`).join('');
  document.querySelector('#themes').innerHTML=['paper','frost','contrast'].flatMap(palette=>['light','dark'].map(mode=>`<section class="surface" data-palette="${palette}" data-mode="${mode}"><div class="brand-line"><span class="app-brand-logo" aria-hidden="true"></span>RSSD<span class="tray" title="macOS 菜单栏模板"></span></div><small>${palette} · ${mode}</small><div class="contexts"><img src="/rssd-icon.png" alt="圆角应用图标"><img class="rounded" src="/rssd-icon.png" alt="更强圆角裁切"></div></section>`)).join('');
  document.querySelectorAll('[data-dock]').forEach(el=>el.innerHTML=[128,64,32,24,16].map(size=>`<img src="/rssd-icon.png" width="${size}" height="${size}" alt="${size}px">`).join(''));
</script>
</html>
