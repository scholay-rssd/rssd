<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留言板</title><link rel="stylesheet" href="/guestbook/style.css"><script src="/guestbook/app.js" defer></script></head><body><main><header><a id="home" href="/">← 返回首页</a><p class="eyebrow" id="site">TODAY · GUESTBOOK</p><h1>留个言，<br>让想法有回音。</h1><p>问题、线索与合作，都从一次交流开始。</p></header><div class="columns"><section class="compose"><h2>写给站长</h2><p id="quota" role="status">正在连接留言板…</p><form id="form"><label>留言类型<select id="kind" name="kind" disabled></select></label><label>昵称<input name="name" required maxlength="60" autocomplete="nickname"></label><label>公开留言<textarea name="message" required maxlength="3000" rows="5" placeholder="写下你的想法。请勿在公开内容中填写联系方式或其他隐私。"></textarea></label><details open><summary>补充信息 · 仅站长可见</summary><div id="details"></div><label>联系方式（选填，仅站长可见）<input name="contact" maxlength="200" placeholder="邮箱或其他方便联系的方式"></label></details><p class="hint">每个浏览器每天在本站可提交 2 条，按本站时区重置。留言审核后公开；补充信息与联系方式不会公开。清除浏览器标识或更换设备会重新识别。</p><button id="send" disabled>提交留言</button><p id="status" role="status" aria-live="polite"></p></form></section><section class="board"><div class="section-head"><h2>留言墙</h2><span>审核后公开</span></div><div id="messages"><p class="empty">正在加载…</p></div></section></div><footer>认真读每一条留言。个人问题反馈与合作细节会保留在站长的私有收件箱。</footer></main></body></html>
