name: Public product checks
# Same triggers as the headless workflow: every push, fork pull requests,
# superseded branch runs cancelled.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
jobs:
  public-boundary:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No private overlays, data, receipts or credentials
        run: node scripts/check-public-boundary.mjs
  secrets-schema:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: scholay-rssd/rssd-secrets
          path: .local/rssd-secrets
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Every secret read is declared in rssd-secrets
        run: node .local/rssd-secrets/scripts/coverage.mjs .
  public-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix desktop/runtime --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run demo:build
      - run: npm run desktop:install
      - run: npm run desktop:check
      - run: npm run desktop:build:web
      - uses: actions/upload-artifact@v4
        with:
          name: rssd-public-demo
          path: .local/demo/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: rssd-desktop-web
          path: desktop/dist/
          if-no-files-found: error
          retention-days: 7
