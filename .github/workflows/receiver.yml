name: Web receiver package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/package-receiver.mjs
      - name: Build and verify bilingual pages using only the installed artifact
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/rssd-receiver"
          tar -xzf artifacts/rssd-web-receiver-*-linux-x64.tar.gz -C "$RUNNER_TEMP/rssd-receiver"
          RSSD_RECEIVER_ARTIFACT_DIR="$RUNNER_TEMP/rssd-receiver" "$RUNNER_TEMP/rssd-receiver/node" --test tests/rssd-receiver-http.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rssd-web-receiver-linux-x64-${{ github.sha }}
          path: artifacts/rssd-web-receiver-*
          if-no-files-found: error
          retention-days: 14
