name: Headless packages
# Every push is checked and its artifacts carry that commit. A pull request
# from a branch of this repository is already checked by the push run on the
# same commit, so pull_request runs check forks only. Superseded runs on a
# branch are cancelled; runs on main and manual dispatches always finish.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-15
            name: darwin-arm64
          - os: macos-15-intel
            name: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/rssd-headless-runtime.test.mjs tests/rssd-headless-package.test.mjs
      - run: node scripts/build-headless.mjs
      - name: Verify the independent installation
        env:
          RSSD_RUNTIME_HOME: ${{ runner.temp }}/rssd-installation
          RSSD_CENTER_HOME: ${{ runner.temp }}/rssd-device
        run: |
          set -eu
          source=desktop/target/bundle-resources/workbench
          archive=$(find artifacts -name 'rssd-headless-*-${{ matrix.name }}.tar.gz' -print -quit)
          test -n "$archive"
          "$source/node" "$source/desktop/scripts/agent/headless/standalone.mjs" install --manifest-sha256 "$(cat artifacts/runtime-manifest.sha256)"
          "$RSSD_RUNTIME_HOME/rssd" version
          "$RSSD_RUNTIME_HOME/rssd" center --help
          "$RSSD_RUNTIME_HOME/rssd" writing-policy > "$RUNNER_TEMP/writing-policy.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rssd-headless-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
