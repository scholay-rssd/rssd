name: Move submodule pins
# Moves every submodule pin to its submodule's GitHub main (CLAUDE.md rule 4),
# so nobody opens pin-only pull requests by hand.
#
# The pin commit goes to the bot/move-pins branch and into one pull request,
# set to merge itself once the four required checks pass. Branch and pull
# request are made with a token of the rssd-pin-bot GitHub App, not with this
# workflow's own token: GitHub starts no workflow for a pull request opened
# with that one, so the required checks would never report.
# While the pull request is open, a later run only replaces its commit when a
# submodule main moved again; if every pin already reached its main another way,
# the pull request is closed. A pull request whose checks failed stays open
# until a submodule main changes and the next run replaces the commit.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: move-submodule-pins
  cancel-in-progress: false
jobs:
  move-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: bot/move-pins
    steps:
      - name: Token of the pin bot app
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIN_BOT_APP_ID }}
          private-key: ${{ secrets.PIN_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Move the pins in the index
        id: move
        run: |
          node scripts/move-submodule-pins.mjs --apply --message "$RUNNER_TEMP/message"
          if [ -f "$RUNNER_TEMP/message" ]; then echo moved=true >> "$GITHUB_OUTPUT"; fi
      - name: Close the pull request when nothing is left to move
        if: ${{ !steps.move.outputs.moved }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "Every pin already reached its submodule's main."
          fi
      - name: Commit; every new pin is on its submodule's main
        if: steps.move.outputs.moved
        run: |
          git -c user.name='rssd-pin-bot[bot]' -c user.email='359386025+rssd-pin-bot[bot]@users.noreply.github.com' \
            commit -q --no-verify -F "$RUNNER_TEMP/message"
          node scripts/check-submodule-pins.mjs
      - name: Open or update the pull request
        if: steps.move.outputs.moved
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          pins() { git ls-tree -r "$1" | awk '$2 == "commit"'; }
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$pr" ] && [ -n "$remote" ] && git fetch -q --depth 1 origin "$remote" \
            && [ "$(pins "$remote")" = "$(pins HEAD)" ]; then
            echo "Pull request #$pr already moves the pins to the same commits"
          else
            git push -q --force origin "HEAD:refs/heads/$BRANCH"
            title=$(head -n 1 "$RUNNER_TEMP/message")
            tail -n +3 "$RUNNER_TEMP/message" | sed 's/^  /- /' > "$RUNNER_TEMP/body"
            printf '\nOpened by the `Move submodule pins` workflow; it merges itself once the required checks pass.\n' >> "$RUNNER_TEMP/body"
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body"
            else
              pr=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body" | grep -o '[0-9]*$')
            fi
          fi
          gh pr merge "$pr" --auto --merge
