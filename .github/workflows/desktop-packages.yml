name: Desktop packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix desktop/runtime --no-audit --no-fund
      - run: npm run desktop:install
      - run: npm run desktop:check
      - if: runner.os == 'Windows'
        run: npm run desktop:build
      - name: Build an explicit unsigned macOS development artifact
        if: runner.os == 'macOS'
        run: pnpm --dir desktop tauri build --bundles app --no-sign --ci -- --locked
      - name: Archive the macOS development bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent desktop/target/release/bundle/macos/RSSD.app artifacts/rssd-${{ matrix.name }}-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rssd-${{ matrix.name }}-${{ github.sha }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
      # These are unsigned development artifacts. Signed updater publication
      # is a separate protected release flow and retains the existing key.
